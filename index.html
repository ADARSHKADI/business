    const classSelect =

    classSelect.innerHTML =

// ======================================================
// CLASS CHANGE - PRELOAD STUDENT DATA
// ======================================================

let classStudentCache = {};
let classLoadPromises = {};
let activeClassKey = "";


document
.getElementById("className")
.addEventListener("change", function(){

    const std = document.getElementById("std").value;
    const className = this.value;

    clearStudentFields();
    lastSearchedKey = "";

    if(!std || !className){
        activeClassKey = "";
        hideSearchStatus();
        return;
    }

    activeClassKey = std + "|" + className;
    preloadClassStudents(std, className);

});


// ======================================================
// PRELOAD STUDENTS FOR SELECTED CLASS
// ======================================================

function preloadClassStudents(std, className){

    const key = std + "|" + className;

    if(classStudentCache[key]){
        return Promise.resolve(classStudentCache[key]);
    }

    if(classLoadPromises[key]){
        return classLoadPromises[key];
    }

    showSearchStatus("Loading class students...");

    const url =
        API_URL +
        "?action=studentClass" +
        "&std=" + encodeURIComponent(std) +
        "&className=" + encodeURIComponent(className);

    classLoadPromises[key] = fetchWithTimeout(url, 12000)
    .then(function(res){

        if(!res.ok){
            throw new Error("Server returned " + res.status);
        }

        return res.json();

    })
    .then(function(response){

        if(!response.status){
            throw new Error(response.message || "Class student data could not be loaded.");
        }

        const list = Array.isArray(response.students)
            ? response.students
            : [];

        const index = {};

        list.forEach(function(student){
            const roll = String(student.roll || "").trim();
            if(roll){
                index[roll] = student;
            }
        });

        classStudentCache[key] = index;

        return index;

    })
    .catch(function(err){

        console.log("Class preload error:", err);

        // Do not show a scary error immediately. Search can retry from server.
        return null;

    })
    .finally(function(){

        delete classLoadPromises[key];

        if(activeClassKey === key){
            hideSearchStatus();
        }

    });

    return classLoadPromises[key];
}


// ======================================================
// ROLL SEARCH - LOCAL FIRST
// ======================================================

let searchTimer = null;
let lastSearchedKey = "";
let searchRequestNo = 0;


document
.getElementById("roll")
.addEventListener("input", function(){

    const rollValue = this.value.trim();

    clearTimeout(searchTimer);

    if(!rollValue){
        hideSearchStatus();
        return;
    }

    const std =
        document.getElementById("std").value;

    const className =
        document.getElementById("className").value;

    if(!std || !className){
        return;
    }

    const key =
        std + "|" + className + "|" + rollValue;

    if(key === lastSearchedKey){
        return;
    }

    // 250 ms is enough for normal typing and feels much faster than 1500 ms.
    searchTimer = setTimeout(function(){
        searchStudentFast(std, className, rollValue);
    }, 250);

});


// ======================================================
// FAST STUDENT SEARCH
// ======================================================

async function searchStudentFast(std, className, roll){

    const key = std + "|" + className + "|" + roll;
    const classKey = std + "|" + className;
    const requestId = ++searchRequestNo;

    if(key === lastSearchedKey){
        return;
    }

    // --------------------------------------------------
    // 1. Search in browser memory first - normally instant.
    // --------------------------------------------------

    const cached = classStudentCache[classKey];

    if(cached){

        const student = cached[String(roll).trim()];

        if(requestId !== searchRequestNo){
            return;
        }

        if(student){
            lastSearchedKey = key;
            showStudentPopup(student);
        }
        else{
            showStudentNotFound();
        }

        hideSearchStatus();
        return;
    }

    // --------------------------------------------------
    // 2. If preload has not finished, wait for it.
    // --------------------------------------------------

    showSearchStatus("Searching student...");

    const loaded = await preloadClassStudents(std, className);

    if(requestId !== searchRequestNo){
        return;
    }

    if(loaded){

        const student = loaded[String(roll).trim()];

        hideSearchStatus();

        if(student){
            lastSearchedKey = key;
            showStudentPopup(student);
        }
        else{
            showStudentNotFound();
        }

        return;
    }

    // --------------------------------------------------
    // 3. Fallback: direct server search with retry.
    // --------------------------------------------------

    searchStudentServer(std, className, roll, requestId);
}


// ======================================================
// SERVER FALLBACK SEARCH
// ======================================================

function searchStudentServer(std, className, roll, requestId, attempt){

    attempt = attempt || 1;

    showSearchStatus(
        attempt === 1
        ? "Connecting to student database..."
        : "Retrying student search..."
    );

    const url =
        API_URL +
        "?action=studentSearch" +
        "&std=" + encodeURIComponent(std) +
        "&className=" + encodeURIComponent(className) +
        "&roll=" + encodeURIComponent(roll);

    fetchWithTimeout(url, 12000)
    .then(function(res){

        if(!res.ok){
            throw new Error("Server returned " + res.status);
        }

        return res.json();

    })
    .then(function(response){

        if(requestId !== searchRequestNo){
            return;
        }

        hideSearchStatus();

        if(response.status && response.found){

            lastSearchedKey =
                std + "|" + className + "|" + roll;

            // Save this student into browser cache too.
            const classKey = std + "|" + className;
            classStudentCache[classKey] =
                classStudentCache[classKey] || {};
            classStudentCache[classKey][String(roll).trim()] = response.student;

            showStudentPopup(response.student);
            return;
        }

        if(response.status && !response.found){
            showStudentNotFound();
            return;
        }

        throw new Error(response.message || "Student search failed.");

    })
    .catch(function(err){

        console.log("Student search error:", err);

        if(requestId !== searchRequestNo){
            return;
        }

        if(attempt < 2){

            setTimeout(function(){
                searchStudentServer(
                    std,
                    className,
                    roll,
                    requestId,
                    attempt + 1
                );
            }, 700);

            return;
        }

        hideSearchStatus();

        Swal.fire({
            icon:"warning",
            title:"Student Search Delayed",
            text:"Student database is taking too long to respond. Please try the roll number again.",
            confirmButtonText:"OK",
            confirmButtonColor:"#0d6efd"
        });

    });
}


// ======================================================
// STUDENT NOT FOUND

// ======================================================
// FETCH WITH TIMEOUT
// ======================================================

function fetchWithTimeout(url, timeoutMs){

    const controller = new AbortController();
    const timer = setTimeout(function(){
        controller.abort();
    }, timeoutMs);

    return fetch(url, { signal: controller.signal })
        .finally(function(){
            clearTimeout(timer);
        });
}

// ======================================================
// CATEGORY + BUSINESS CATALOG LOAD
// ======================================================

let businessCatalog = {};
let businessCatalogPromise = null;

function loadBusinessCatalog(){

    if(Object.keys(businessCatalog).length){
        populateCategories();
        return Promise.resolve(businessCatalog);
    }

    if(businessCatalogPromise){
        return businessCatalogPromise;
    }

    businessCatalogPromise = fetchWithTimeout(
        API_URL + "?action=businessCatalog",
        10000
    )
    .then(function(res){

        if(!res.ok){
            throw new Error("Business catalog server error " + res.status);
        }

        return res.json();

    })
    .then(function(data){

        businessCatalog = data || {};
        populateCategories();
        return businessCatalog;

    })
    .catch(function(err){

        console.log("Business catalog error:", err);
        businessCatalog = {};
        populateCategories();
        return {};

    });

    return businessCatalogPromise;
}


function populateCategories(){

    const category = document.getElementById("category");

    category.innerHTML =
        '<option value="">વ્યવસાયનો પ્રકાર પસંદ કરો</option>';

    Object.keys(businessCatalog)
        .sort()
        .forEach(function(item){

            const option = document.createElement("option");
            option.value = item;
            option.textContent = item;
            category.appendChild(option);

        });
}


function populateBusinesses(categoryName){

    const business = document.getElementById("business");

    business.innerHTML =
        '<option value="">વ્યવસાય પસંદ કરો</option>';

    if(!categoryName){
        business.disabled = true;
        return;
    }

    const list = businessCatalog[categoryName] || [];

    list.forEach(function(item){

        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        business.appendChild(option);

    });

    business.disabled = false;
}

});


// ======================================================
// SAVE DATA
// ======================================================

function saveData(){

    clearErrors();


    const data = {

        std:
        document.getElementById("std")
        .value.trim(),

        className:
        document.getElementById("className")
        .value.trim(),

        roll:
        document.getElementById("roll")
        .value.trim(),

        gr:
        document.getElementById("gr")
        .value.trim(),

        student:
        document.getElementById("student")
        .value.trim(),

        mobile:
        document.getElementById("mobile")
        .value.trim(),

        district:
        document.getElementById("district")
        .value.trim(),

        taluka:
        document.getElementById("taluka")
        .value.trim(),

        village:
        document.getElementById("village")
        .value.trim(),

        category:
        document.getElementById("category")
        .value.trim(),

        business:
        document.getElementById("business")
        .value.trim(),

        other:
        document.getElementById("other")
        .value.trim(),

        admission:
        document.getElementById("admission")
        .value.trim(),

        updown:
        document.getElementById("updown")
        .value.trim()

    };


    // ==============================================
    // VALIDATION
    // ==============================================

    if(!data.std){

        showError(
            "std",
            "ધોરણ પસંદ કરો."
        );

        return;

    }


    if(!data.className){

        showError(
            "className",
            "વર્ગ પસંદ કરો."
        );

        return;

    }


    if(!data.roll){

        showError(
            "roll",
            "Roll નંબર લખો."
        );

        return;

    }


    if(!/^\d+$/.test(data.roll)){

        showError(
            "roll",
            "માત્ર નંબર લખો."
        );

        return;

    }


    if(!data.gr){

        showError(
            "gr",
            "GR નંબર લખો."
        );

        return;

    }


    if(!data.student){

        showError(
            "student",
            "વિદ્યાર્થીનું નામ લખો."
        );

        return;

    }


    if(!data.mobile){

        showError(
            "mobile",
            "મોબાઈલ નંબર લખો."
        );

        return;

    }


    if(!/^[6-9]\d{9}$/.test(data.mobile)){

        showError(
            "mobile",
            "યોગ્ય 10 અંકનો મોબાઈલ નંબર લખો."
        );

        return;

    }


    if(!data.district){

        showError(
            "district",
            "જિલ્લો પસંદ કરો."
        );

        return;

    }


    if(!data.taluka){

        showError(
            "taluka",
            "તાલુકો પસંદ કરો."
        );

        return;

    }


    if(!data.village){

        showError(
            "village",
            "ગામ લખો."
        );

        return;

    }


    if(!data.category){

        showError(
            "category",
            "Category પસંદ કરો."
        );

        return;

    }


    if(!data.business){

        showError(
            "business",
            "Business પસંદ કરો."
        );

        return;

    }


    if(!data.updown){

        showError(
            "updown",
            "અપડાઉન પસંદ કરો."
        );

        return;

    }


    // ==============================================
    // SAVE
    // ==============================================

    const btn =
    document.getElementById("saveBtn");


    btn.disabled = true;


    showLoader(
        "Saving Student Data...",
        "Please wait while data is being saved."
    );


    fetch(API_URL,{

        method:"POST",

        body:JSON.stringify(data)

    })

    .then(res => res.json())

    .then(response => {


        if(response.status){

            hideLoader();


            // --------------------------------------
            // CONFIRMATION POPUP
            // --------------------------------------

            Swal.fire({

                icon:"success",

                title:"Entry Saved Successfully",

                html:`

                <div style="
                text-align:left;
                background:#f7faff;
                padding:15px;
                border-radius:12px;
                ">

                <div>
                <b>Student:</b>
                ${escapeHtml(data.student)}
                </div>

                <div>
                <b>Roll No.:</b>
                ${escapeHtml(data.roll)}
                </div>

                <div>
                <b>GR:</b>
                ${escapeHtml(data.gr)}
                </div>

                <div>
                <b>Mobile:</b>
                ${escapeHtml(data.mobile)}
                </div>

                <div>
                <b>Class:</b>
                ${escapeHtml(data.std)}
                -
                ${escapeHtml(data.className)}
                </div>

                <div>
                <b>District:</b>
                ${escapeHtml(data.district)}
                </div>

                <div>
                <b>Taluka:</b>
                ${escapeHtml(data.taluka)}
                </div>

                <div>
                <b>Village:</b>
                ${escapeHtml(data.village)}
                </div>

                </div>

                `,

                confirmButtonText:"OK",

                confirmButtonColor:"#198754"

            });


            // --------------------------------------
            // RESET FOR NEXT STUDENT
            // KEEP STD + CLASS
            // --------------------------------------

            document.getElementById("roll").value="";

            document.getElementById("gr").value="";

            document.getElementById("student").value="";

            document.getElementById("mobile").value="";

            document.getElementById("village").value="";

            document.getElementById("other").value="";

            document.getElementById("district").selectedIndex=0;

            document.getElementById("taluka").innerHTML =
            '<option value="">તાલુકો પસંદ કરો</option>';

            document.getElementById("taluka").disabled=true;

            document.getElementById("category").selectedIndex=0;

            document.getElementById("business").innerHTML =
            '<option value="">વ્યવસાય પસંદ કરો</option>';

            document.getElementById("admission").selectedIndex=0;

            document.getElementById("updown").selectedIndex=0;


            lastSearchedKey = "";


            loadReport();


            setTimeout(function(){

                document
                .getElementById("roll")
                .focus();

            },500);

        }

        else{

            hideLoader();

            Swal.fire({

                icon:"error",

                title:"Save Failed",

                text:
                response.message ||
                "Data could not be saved."

            });

        }

    })

    .catch(err => {

        hideLoader();

        console.log(err);

        Swal.fire({

            icon:"error",

            title:"Connection Error",

            text:
            "Data save failed. Please try again."

        });

    })

    .finally(function(){

        btn.disabled=false;

    });

}


// ======================================================
// LOADER
// ======================================================

function showLoader(
    title,
    sub
){

    document
    .getElementById("loaderTitle")
    .innerHTML = title;


    document
    .getElementById("loaderSub")
    .innerHTML = sub;


    document
    .getElementById("loadingOverlay")
    .style.display = "flex";

}


function hideLoader(){

    document
    .getElementById("loadingOverlay")
    .style.display = "none";

}


// ======================================================
// SEARCH STATUS
// ======================================================

function showSearchStatus(message){

    const el = document.getElementById("studentSearchStatus");

    if(message){
        el.innerHTML =
            '<span class="mini-spinner"></span>' +
            escapeHtml(message);
    }

    el.style.display = "block";

}


function hideSearchStatus(){

    document
    .getElementById("studentSearchStatus")
    .style.display = "none";

}


// ======================================================
// CLEAR STUDENT FIELDS
// ======================================================

function clearStudentFields(){

    document.getElementById("roll").value="";

    document.getElementById("gr").value="";

    document.getElementById("student").value="";

    document.getElementById("mobile").value="";

    lastSearchedKey="";

}


// ======================================================
// CLEAR ERRORS
// ======================================================

function clearErrors(){

    document
    .querySelectorAll(
        ".form-control,.form-select"
    )
    .forEach(function(el){

        el.classList.remove(
            "is-invalid"
        );

    });


    document
    .querySelectorAll(
        ".invalid-feedback"
    )
    .forEach(function(el){

        el.innerHTML="";

    });

}


// ======================================================
// SHOW ERROR
// ======================================================

function showError(
    id,
    message
){

    const el =
    document.getElementById(id);


    el.classList.add(
        "is-invalid"
    );


    const error =
    document.getElementById(
        id + "Error"
    );


    if(error){

        error.innerHTML =
        message;

    }


    el.focus();

}

// REPORT

        // report.html અલગ page છે,

        console.log(

        );

    })

    .catch(err => {

        console.log(err);

    });

}


// ======================================================
// HTML ESCAPE
// ======================================================

function escapeHtml(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
