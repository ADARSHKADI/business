    const selectedStd = this.value;

    const classSelect =
    document.getElementById("className");

    classSelect.innerHTML =

        option.value = cls;

// ======================================================
// STUDENT DATABASE - ONE TIME LOAD
// ======================================================
// IMPORTANT:
// Student search NEVER calls Apps Script.
// The complete student database is loaded once into
// browser memory and localStorage.
// ======================================================

let STUDENT_DATABASE = {};
let STUDENT_DB_READY = false;
let STUDENT_DB_LOADING = null;
const STUDENT_DB_STORAGE_KEY = "STUDENT_DATABASE_2026_27_V5";


function normalizeStudentDatabase(db){

    if(!db || typeof db !== "object") return {};

    const result = {};

    Object.keys(db).forEach(function(classKey){

        const source = db[classKey] || {};
        const target = {};

        Object.keys(source).forEach(function(roll){

            const student = source[roll];
            if(!student) return;

            const cleanRoll = String(
                student.roll || roll || ""
            ).trim();

            if(!cleanRoll) return;

            target[cleanRoll] = {
                roll: cleanRoll,
                gr: String(student.gr || "").trim(),
                name: String(student.name || "").trim(),
                mobile: String(student.mobile || "").trim(),
                sheet: String(student.sheet || "").trim()
            };
        });

        result[classKey] = target;
    });

    return result;
}


function saveStudentDatabaseLocal(db){

    try{
        localStorage.setItem(
            STUDENT_DB_STORAGE_KEY,
            JSON.stringify({
                version: 5,
                time: Date.now(),
                data: db
            })
        );
    }catch(e){
        console.warn("Student database localStorage error:", e);
    }
}


function getStudentDatabaseLocal(){

    try{
        const raw = localStorage.getItem(
            STUDENT_DB_STORAGE_KEY
        );

        if(!raw) return null;

        const obj = JSON.parse(raw);

        if(!obj || !obj.data) return null;

        return normalizeStudentDatabase(obj.data);

    }catch(e){
        console.warn("Student database cache error:", e);
        return null;
    }
}


function showDatabaseStatus(message){

    const el = document.getElementById("studentSearchStatus");

    if(!el) return;

    el.innerHTML = message;
    el.style.display = "block";
}


function hideDatabaseStatus(){

    const el = document.getElementById("studentSearchStatus");

    if(el) el.style.display = "none";
}


// ======================================================
// LOAD COMPLETE DATABASE - ONLY ONE SERVER REQUEST
// ======================================================

function loadStudentDatabase(){

    if(STUDENT_DB_READY){
        return Promise.resolve(STUDENT_DATABASE);
    }

    if(STUDENT_DB_LOADING){
        return STUDENT_DB_LOADING;
    }


    // --------------------------------------------------
    // 1. Browser localStorage
    // --------------------------------------------------

    const localData = getStudentDatabaseLocal();

    if(localData && Object.keys(localData).length){

        STUDENT_DATABASE = localData;
        STUDENT_DB_READY = true;

        console.log(
            "Student database loaded from browser cache"
        );

        return Promise.resolve(STUDENT_DATABASE);
    }


    // --------------------------------------------------
    // 2. FIRST LOAD ONLY
    // --------------------------------------------------

    showDatabaseStatus(
        "વિદ્યાર્થી ડેટાબેઝ એક વખત લોડ થઈ રહ્યો છે..."
    );

    const url =
        API_URL +
        "?action=studentDatabase&_=" +
        Date.now();

    STUDENT_DB_LOADING = fetchWithTimeout(
        url,
        60000
    )
    .then(function(res){

        if(!res.ok){
            throw new Error(
                "Server returned " + res.status
            );
        }

        return res.json();
    })
    .then(function(response){

        if(!response.status){
            throw new Error(
                response.message ||
                "Student database could not be loaded."
            );
        }

        const db = normalizeStudentDatabase(
            response.database
        );

        if(!Object.keys(db).length){
            throw new Error(
                "Student database is empty."
            );
        }

        STUDENT_DATABASE = db;
        STUDENT_DB_READY = true;

        saveStudentDatabaseLocal(db);

        console.log(
            "Complete student database loaded once."
        );

        hideDatabaseStatus();

        return STUDENT_DATABASE;
    })
    .catch(function(err){

        STUDENT_DB_READY = false;

        console.error(
            "Student database load failed:",
            err
        );

        showDatabaseStatus(
            "વિદ્યાર્થી ડેટાબેઝ લોડ થઈ શક્યો નથી. " +
            "<button type='button' class='btn btn-sm btn-danger ms-2' " +
            "onclick='retryStudentDatabase()'>ફરી લોડ કરો</button>"
        );

        throw err;

    })
    .finally(function(){
        STUDENT_DB_LOADING = null;
    });

    return STUDENT_DB_LOADING;
}


function retryStudentDatabase(){

    STUDENT_DB_READY = false;
    STUDENT_DATABASE = {};

    try{
        localStorage.removeItem(
            STUDENT_DB_STORAGE_KEY
        );
    }catch(e){}

    loadStudentDatabase()
        .catch(function(){});
}

// ======================================================
// ROLL SEARCH - 100% LOCAL
// ======================================================

let searchTimer = null;
let lastSearchedKey = "";
let searchRequestNo = 0;


document
.getElementById("roll")
.addEventListener("input", function(){

    const rollValue = this.value.trim();

    clearTimeout(searchTimer);

    if(!rollValue){
        hideSearchStatus();
        return;
    }

    const std =
        document.getElementById("std").value;

    const className =
        document.getElementById("className").value;

    if(!std || !className){
        return;
    }

    const key =
        std + "|" + className + "|" + rollValue;

    if(key === lastSearchedKey){
        return;
    }

    // Very small debounce only for typing.
    searchTimer = setTimeout(function(){

        searchStudentLocal(
            std,
            className,
            rollValue
        );

    }, 120);

});


// ======================================================
// LOCAL STUDENT SEARCH
// ======================================================

async function searchStudentLocal(std, className, roll){

    const requestId = ++searchRequestNo;

    // If first database load is still running, wait for it.
    if(!STUDENT_DB_READY){

        showSearchStatus(
            "વિદ્યાર્થી ડેટાબેઝ તૈયાર થઈ રહ્યો છે..."
        );

        try{
            await loadStudentDatabase();
        }catch(e){
            return;
        }
    }

    if(requestId !== searchRequestNo){
        return;
    }

    const classKey =
        String(std).trim() +
        "|" +
        String(className).trim();

    const classData =
        STUDENT_DATABASE[classKey] || {};

    const student =
        classData[String(roll).trim()];

    hideSearchStatus();

    if(student){

        lastSearchedKey =
            std + "|" + className + "|" + roll;

        showStudentPopup(student);

    }else{

        showStudentNotFound();
    }
}

// ======================================================
// FETCH WITH TIMEOUT
// ======================================================

function fetchWithTimeout(url, timeoutMs){

    const controller = new AbortController();
    const timer = setTimeout(function(){
        controller.abort();
    }, timeoutMs);

    return fetch(url, { signal: controller.signal })
        .finally(function(){
            clearTimeout(timer);
        });
}

// ======================================================
// SAVE DATA
// ======================================================

// ======================================================

function saveData(){

    clearErrors();


    const data = {

        std:
        document.getElementById("std")
        .value.trim(),

        className:
        document.getElementById("className")
        .value.trim(),

        roll:
        document.getElementById("roll")
        .value.trim(),

        gr:
        document.getElementById("gr")
        .value.trim(),

        student:
        document.getElementById("student")
        .value.trim(),

        mobile:
        document.getElementById("mobile")
        .value.trim(),

        district:
        document.getElementById("district")
        .value.trim(),

        taluka:
        document.getElementById("taluka")
        .value.trim(),

        village:
        document.getElementById("village")
        .value.trim(),

        category:
        document.getElementById("category")
        .value.trim(),

        business:
        document.getElementById("business")
        .value.trim(),

        other:
        document.getElementById("other")
        .value.trim(),

        admission:
        document.getElementById("admission")
        .value.trim(),

        updown:
        document.getElementById("updown")
        .value.trim()

    };


    // ==============================================
    // VALIDATION
    // ==============================================

    if(!data.std){

        showError(
            "std",
            "ધોરણ પસંદ કરો."
        );

        return;

    }


    if(!data.className){

        showError(
            "className",
            "વર્ગ પસંદ કરો."
        );

        return;

    }


    if(!data.roll){

        showError(
            "roll",
            "Roll નંબર લખો."
        );

        return;

    }


    if(!/^\d+$/.test(data.roll)){

        showError(
            "roll",
            "માત્ર નંબર લખો."
        );

        return;

    }


    if(!data.gr){

        showError(
            "gr",
            "GR નંબર લખો."
        );

        return;

    }


    if(!data.student){

        showError(
            "student",
            "વિદ્યાર્થીનું નામ લખો."
        );

        return;

    }


    if(!data.mobile){

        showError(
            "mobile",
            "મોબાઈલ નંબર લખો."
        );

        return;

    }


    if(!/^[6-9]\d{9}$/.test(data.mobile)){

        showError(
            "mobile",
            "યોગ્ય 10 અંકનો મોબાઈલ નંબર લખો."
        );

        return;

    }


    if(!data.district){

        showError(
            "district",
            "જિલ્લો પસંદ કરો."
        );

        return;

    }


    if(!data.taluka){

        showError(
            "taluka",
            "તાલુકો પસંદ કરો."
        );

        return;

    }


    if(!data.village){

        showError(
            "village",
            "ગામ લખો."
        );

        return;

    }


    if(!data.category){

        showError(
            "category",
            "Category પસંદ કરો."
        );

        return;

    }


    if(!data.business){

        showError(
            "business",
            "Business પસંદ કરો."
        );

        return;

    }


    if(!data.updown){

        showError(
            "updown",
            "અપડાઉન પસંદ કરો."
        );

        return;

    }


    // ==============================================
    // SAVE
    // ==============================================

    const btn =
    document.getElementById("saveBtn");


    btn.disabled = true;


    showLoader(
        "Saving Student Data...",
        "Please wait while data is being saved."
    );


    fetch(API_URL,{

        method:"POST",

        body:JSON.stringify(data)

    })

    .then(res => res.json())

    .then(response => {


        if(response.status){

            hideLoader();


            // --------------------------------------
            // CONFIRMATION POPUP
            // --------------------------------------

            Swal.fire({

                icon:"success",

                title:"Entry Saved Successfully",

                html:`

                <div style="
                text-align:left;
                background:#f7faff;
                padding:15px;
                border-radius:12px;
                ">

                <div>
                <b>Student:</b>
                ${escapeHtml(data.student)}
                </div>

                <div>
                <b>Roll No.:</b>
                ${escapeHtml(data.roll)}
                </div>

                <div>
                <b>GR:</b>
                ${escapeHtml(data.gr)}
                </div>

                <div>
                <b>Mobile:</b>
                ${escapeHtml(data.mobile)}
                </div>

                <div>
                <b>Class:</b>
                ${escapeHtml(data.std)}
                -
                ${escapeHtml(data.className)}
                </div>

                <div>
                <b>District:</b>
                ${escapeHtml(data.district)}
                </div>

                <div>
                <b>Taluka:</b>
                ${escapeHtml(data.taluka)}
                </div>

                <div>
                <b>Village:</b>
                ${escapeHtml(data.village)}
                </div>

                </div>

                `,

                confirmButtonText:"OK",

                confirmButtonColor:"#198754"

            });


            // --------------------------------------
            // RESET FOR NEXT STUDENT
            // KEEP STD + CLASS
            // --------------------------------------

            document.getElementById("roll").value="";

            document.getElementById("gr").value="";

            document.getElementById("student").value="";

            document.getElementById("mobile").value="";

            document.getElementById("village").value="";

            document.getElementById("other").value="";

            document.getElementById("district").selectedIndex=0;

            document.getElementById("taluka").innerHTML =
            '<option value="">તાલુકો પસંદ કરો</option>';

            document.getElementById("taluka").disabled=true;

            document.getElementById("category").selectedIndex=0;

            document.getElementById("business").innerHTML =
            '<option value="">વ્યવસાય પસંદ કરો</option>';

            document.getElementById("admission").selectedIndex=0;

            document.getElementById("updown").selectedIndex=0;


            lastSearchedKey = "";


            loadReport();


            setTimeout(function(){

                document
                .getElementById("roll")
                .focus();

            },500);

        }

        else{

            hideLoader();

            Swal.fire({

                icon:"error",

                title:"Save Failed",

                text:
                response.message ||
                "Data could not be saved."

            });

        }

    })

    .catch(err => {

        hideLoader();

        console.log(err);

        Swal.fire({

            icon:"error",

            title:"Connection Error",

            text:
            "Data save failed. Please try again."

        });

    })

    .finally(function(){

        btn.disabled=false;

    });

}

// ======================================================
// HTML ESCAPE
// ======================================================

function escapeHtml(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
