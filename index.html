// ======================================================
// LOAD CLASS
// ======================================================

document
.getElementById("std")
.addEventListener("change", function(){

    const selectedStd = this.value;

    const classSelect =
    document.getElementById("className");

    classSelect.innerHTML =
    '<option value="">વર્ગ પસંદ કરો</option>';


    if(!selectedStd){

        return;

    }


    CLASS_DATA[selectedStd]
    .forEach(function(cls){

        const option =
        document.createElement("option");

        option.value = cls;

        option.textContent = cls;

        classSelect.appendChild(option);

    });


    clearStudentFields();

});


// ======================================================
// LOAD CLASS INITIAL
// ======================================================

function loadClasses(){

    const std =
    document.getElementById("std");

    if(std.value){

        std.dispatchEvent(
            new Event("change")
        );

    }

}


// ======================================================
// ROLL SEARCH
// ======================================================

let searchTimer = null;

let lastSearchedKey = "";

document
.getElementById("roll")
.addEventListener("input", function(){

    const rollValue =
    this.value.trim();

    clearTimeout(searchTimer);

    if(!rollValue){
        hideSearchStatus();
        return;
    }

    const std =
    document.getElementById("std").value;

    const className =
    document.getElementById("className").value;

    if(!std || !className){
        return;
    }

    const key =
    std + "|" +
    className + "|" +
    rollValue;

    if(key === lastSearchedKey){
        return;
    }

    searchTimer =
    setTimeout(function(){

        searchStudent(
            std,
            className,
            rollValue
        );

    },1500);

});
// ======================================================
// SEARCH STUDENT
// ======================================================

function searchStudent(
    std,
    className,
    roll
){

    showSearchStatus();


    const url =
    API_URL +
    "?action=studentSearch" +
    "&std=" +
    encodeURIComponent(std) +
    "&className=" +
    encodeURIComponent(className) +
    "&roll=" +
    encodeURIComponent(roll);


    fetch(url)

    .then(res => res.json())

    .then(response => {

        hideSearchStatus();


        if(
            response.status &&
            response.found
        ){

            lastSearchedKey =
            std + "|" +
            className + "|" +
            roll;


            showStudentPopup(
                response.student
            );

        }

        else if(
            response.status &&
            !response.found
        ){

            Swal.fire({

                icon:"info",

                title:"Student Not Found",

                html:
                "<b>Fill details manually.</b><br>" +
                "આ વિદ્યાર્થીની વિગતો જાતે ભરો.",

                confirmButtonText:"OK",

                confirmButtonColor:"#0d6efd"

            });

        }

        else{

            Swal.fire({

                icon:"error",

                title:"Search Error",

                text:
                response.message ||
                "Student search failed."

            });

        }

    })

    .catch(err => {

        hideSearchStatus();

        Swal.fire({

            icon:"error",

            title:"Connection Error",

            text:
            "Student search failed. Please try again."

        });

        console.log(err);

    });

}

// ======================================================
// SAVE DATA
// ======================================================

function saveData(){

    clearErrors();


    const data = {

        std:
        document.getElementById("std")
        .value.trim(),

        className:
        document.getElementById("className")
        .value.trim(),

        roll:
        document.getElementById("roll")
        .value.trim(),

        gr:
        document.getElementById("gr")
        .value.trim(),

        student:
        document.getElementById("student")
        .value.trim(),

        mobile:
        document.getElementById("mobile")
        .value.trim(),

        district:
        document.getElementById("district")
        .value.trim(),

        taluka:
        document.getElementById("taluka")
        .value.trim(),

        village:
        document.getElementById("village")
        .value.trim(),

        category:
        document.getElementById("category")
        .value.trim(),

        business:
        document.getElementById("business")
        .value.trim(),

        other:
        document.getElementById("other")
        .value.trim(),

        admission:
        document.getElementById("admission")
        .value.trim(),

        updown:
        document.getElementById("updown")
        .value.trim()

    };


    // ==============================================
    // VALIDATION
    // ==============================================

    if(!data.std){

        showError(
            "std",
            "ધોરણ પસંદ કરો."
        );

        return;

    }


    if(!data.className){

        showError(
            "className",
            "વર્ગ પસંદ કરો."
        );

        return;

    }


    if(!data.roll){

        showError(
            "roll",
            "Roll નંબર લખો."
        );

        return;

    }


    if(!/^\d+$/.test(data.roll)){

        showError(
            "roll",
            "માત્ર નંબર લખો."
        );

        return;

    }


    if(!data.gr){

        showError(
            "gr",
            "GR નંબર લખો."
        );

        return;

    }


    if(!data.student){

        showError(
            "student",
            "વિદ્યાર્થીનું નામ લખો."
        );

        return;

    }


    if(!data.mobile){

        showError(
            "mobile",
            "મોબાઈલ નંબર લખો."
        );

        return;

    }


    if(!/^[6-9]\d{9}$/.test(data.mobile)){

        showError(
            "mobile",
            "યોગ્ય 10 અંકનો મોબાઈલ નંબર લખો."
        );

        return;

    }


    if(!data.district){

        showError(
            "district",
            "જિલ્લો પસંદ કરો."
        );

        return;

    }


    if(!data.taluka){

        showError(
            "taluka",
            "તાલુકો પસંદ કરો."
        );

        return;

    }


    if(!data.village){

        showError(
            "village",
            "ગામ લખો."
        );

        return;

    }


    if(!data.category){

        showError(
            "category",
            "Category પસંદ કરો."
        );

        return;

    }


    if(!data.business){

        showError(
            "business",
            "Business પસંદ કરો."
        );

        return;

    }


    if(!data.updown){

        showError(
            "updown",
            "અપડાઉન પસંદ કરો."
        );

        return;

    }


    // ==============================================
    // SAVE
    // ==============================================

    const btn =
    document.getElementById("saveBtn");


    btn.disabled = true;


    showLoader(
        "Saving Student Data...",
        "Please wait while data is being saved."
    );


    fetch(API_URL,{

        method:"POST",

        body:JSON.stringify(data)

    })

    .then(res => res.json())

    .then(response => {


        if(response.status){

            hideLoader();


            // --------------------------------------
            // CONFIRMATION POPUP
            // --------------------------------------

            Swal.fire({

                icon:"success",

                title:"Entry Saved Successfully",

                html:`

                <div style="
                text-align:left;
                background:#f7faff;
                padding:15px;
                border-radius:12px;
                ">

                <div>
                <b>Student:</b>
                ${escapeHtml(data.student)}
                </div>

                <div>
                <b>Roll No.:</b>
                ${escapeHtml(data.roll)}
                </div>

                <div>
                <b>GR:</b>
                ${escapeHtml(data.gr)}
                </div>

                <div>
                <b>Mobile:</b>
                ${escapeHtml(data.mobile)}
                </div>

                <div>
                <b>Class:</b>
                ${escapeHtml(data.std)}
                -
                ${escapeHtml(data.className)}
                </div>

                <div>
                <b>District:</b>
                ${escapeHtml(data.district)}
                </div>

                <div>
                <b>Taluka:</b>
                ${escapeHtml(data.taluka)}
                </div>

                <div>
                <b>Village:</b>
                ${escapeHtml(data.village)}
                </div>

                </div>

                `,

                confirmButtonText:"OK",

                confirmButtonColor:"#198754"

            });


            // --------------------------------------
            // RESET FOR NEXT STUDENT
            // KEEP STD + CLASS
            // --------------------------------------

            document.getElementById("roll").value="";

            document.getElementById("gr").value="";

            document.getElementById("student").value="";

            document.getElementById("mobile").value="";

            document.getElementById("village").value="";

            document.getElementById("other").value="";

            document.getElementById("district").selectedIndex=0;

            document.getElementById("taluka").innerHTML =
            '<option value="">તાલુકો પસંદ કરો</option>';

            document.getElementById("taluka").disabled=true;

            document.getElementById("category").selectedIndex=0;

            document.getElementById("business").innerHTML =
            '<option value="">વ્યવસાય પસંદ કરો</option>';

            document.getElementById("admission").selectedIndex=0;

            document.getElementById("updown").selectedIndex=0;


            lastSearchedKey = "";


            loadReport();


            setTimeout(function(){

                document
                .getElementById("roll")
                .focus();

            },500);

        }

        else{

            hideLoader();

            Swal.fire({

                icon:"error",

                title:"Save Failed",

                text:
                response.message ||
                "Data could not be saved."

            });

        }

    })

    .catch(err => {

        hideLoader();

        console.log(err);

        Swal.fire({

            icon:"error",

            title:"Connection Error",

            text:
            "Data save failed. Please try again."

        });

    })

    .finally(function(){

        btn.disabled=false;

    });

}

// CLEAR STUDENT FIELDS
// ======================================================

function clearStudentFields(){

    document.getElementById("roll").value="";

    document.getElementById("gr").value="";

    document.getElementById("student").value="";

    document.getElementById("mobile").value="";

    lastSearchedKey="";

}


// ======================================================
// CLEAR ERRORS
// ======================================================

function clearErrors(){

    document
    .querySelectorAll(
        ".form-control,.form-select"
    )
    .forEach(function(el){

        el.classList.remove(
            "is-invalid"
        );

    });


    document
    .querySelectorAll(
        ".invalid-feedback"
    )
    .forEach(function(el){

        el.innerHTML="";

    });

}


// ======================================================
// SHOW ERROR
// ======================================================

function showError(
    id,
    message
){

    const el =
    document.getElementById(id);


    el.classList.add(
        "is-invalid"
    );


    const error =
    document.getElementById(
        id + "Error"
    );


    if(error){

        error.innerHTML =
        message;

    }


    el.focus();

}

    .catch(err => {

    });

}


// ======================================================
// HTML ESCAPE
// ======================================================

function escapeHtml(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
